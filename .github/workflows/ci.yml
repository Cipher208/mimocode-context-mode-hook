name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/context-mode-hook.log

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        # Real gate. It previously ended in `|| echo "skipped"`, so this job was
        # green by construction and could never fail: tsc was not even a declared
        # dependency, so `bunx` resolved an arbitrary version that rejected
        # moduleResolution "bun" with TS6046.
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        # Narrow strict pass over the hook file alone. The `|| echo "skipped"`
        # fallback is gone for the same reason as in the typecheck job.
        run: bunx --bun tsc --noEmit --strict hooks/context-mode.ts

  e2e:
    name: E2E Hook Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run E2E validation
        run: |
          # Verify hook file syntax
          bun build hooks/context-mode.ts --no-bundle
          # Verify tests pass
          bun test
          # Verify hook structure
          grep -q 'export default' hooks/context-mode.ts
          grep -q 'tool.execute.before' hooks/context-mode.ts
          grep -q 'tool.execute.after' hooks/context-mode.ts
          echo "✓ Hook structure validated"
